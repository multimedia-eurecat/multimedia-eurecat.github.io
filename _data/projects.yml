- name: SHIFT2ZERO
  image: shift2zero_logo.png
  title: Shifting to zero-emission logistics with right-sized, mission-focused N1 eLCVs.
  description: SHIFT2ZERO develops electric light commercial vehicle concepts tailored to urban logistics. The project combines vehicle design with modular cargo solutions, energy management and logistics innovations, validating the concepts in real operating conditions to improve efficiency, safety and usability.
  contribution: Immersive visualisation using virtual and extended reality, including interfaces that help users plan cargo distribution for different vehicle configurations.
  ref: HORIZON-CL5-2024-D5-01-06, GA No. 101192375 (Coordinator Eurecat).
  date: 2025-2028
  url: https://shift2zero-project.eu

