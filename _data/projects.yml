- name: TECSOL-FRUT
  image: tecsol_frut_logo.png
  title: Intelligent agrivoltaics for resilient fruit farming.
  description: TECSOL-FRUT develops and validates agrivoltaic systems that combine fruit production with solar electricity generation. Field sensors, satellite imagery, weather data and predictive models feed a digital twin to assess crop conditions and energy performance, helping farms reduce heat and water stress and adapt to climate change.
  contribution: 3D digital model for representing the agrivoltaic installation and analysing its operation within the digital twin.
  ref: Supra-regional AEI-Agri Operational Group, CAP 2023-2027, project reference REGAGE25e00048201589.
  date: 2026-2029
  url: https://eurecat.org/en/portfolio-items/tecsol-frut/

