# Projects

# Sources: https://cordis.europa.eu/project/id/101307206
- name: ABIGAIL4D
  image: abigail4d_logo.png
  title: Advancing Breast cancer Individualised Generative AI for Longitudinal Outcomes.
  description: ABIGAIL4D develops a prototype 4D generative AI system to model the evolution of early breast cancer and support personalised treatment decisions. It combines longitudinal imaging, pathology, genomics and clinical data to forecast tumour response, survival and toxicity, and to compare alternative treatment strategies through explainable AI agents with quantified uncertainty.
  contribution: Generative models for medical image synthesis and prediction to support diagnosis and prognosis.
  ref: Horizon Europe, EIC Pathfinder Challenges, GA No. 101307206 (Coordinator Eurecat).
  date: 2026-2031
  url: https://cordis.europa.eu/project/id/101307206

