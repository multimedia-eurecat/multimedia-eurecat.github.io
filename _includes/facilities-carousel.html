{% assign images = include.captions %}
<div id="{{ include.id }}" class="carousel slide facilities-carousel" data-ride="carousel" data-interval="5000" data-pause="hover" role="region" aria-roledescription="carousel" aria-label="{{ include.title }} photos" tabindex="0">
  <div class="carousel-inner">
    {% for image in images %}
    <div class="item{% if forloop.first %} active{% endif %}" role="group" aria-roledescription="slide" aria-label="{{ forloop.index }} of {{ images.size }}">
      <img{% if image.fit == "contain" %} class="carousel-image-contain"{% endif %} src="{{ include.directory | append: image.image | relative_url | uri_escape }}" alt="{% if image.eyebrow %}{{ image.eyebrow | escape }}: {% endif %}{{ image.title | escape }}"{% unless forloop.first %} loading="lazy"{% endunless %} decoding="async">
      <div class="carousel-caption">
        {% if image.eyebrow %}<span>{{ image.eyebrow | escape }}</span>{% endif %}
        <h3>{{ image.title | escape }}</h3>
      </div>
    </div>
    {% endfor %}
  </div>

  <div class="facilities-carousel-toolbar">
    <ol class="carousel-indicators" aria-label="Choose a {{ include.title | downcase }} photo">
      {% for image in images %}
      <li{% if forloop.first %} class="active"{% endif %}><button type="button" data-target="#{{ include.id }}" data-slide-to="{{ forloop.index0 }}" aria-label="Show {{ include.title | downcase }} photo {{ forloop.index }}"></button></li>
      {% endfor %}
    </ol>
    <div class="facilities-carousel-actions">
      <button type="button" class="facilities-carousel-pause" aria-label="Pause {{ include.title | downcase }} slideshow" aria-pressed="false"><span aria-hidden="true">Ⅱ</span></button>
      <button type="button" class="left carousel-control" data-target="#{{ include.id }}" data-slide="prev" aria-label="Previous {{ include.title | downcase }} photo"><span aria-hidden="true">←</span></button>
      <button type="button" class="right carousel-control" data-target="#{{ include.id }}" data-slide="next" aria-label="Next {{ include.title | downcase }} photo"><span aria-hidden="true">→</span></button>
    </div>
  </div>
</div>
